[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vimin-core"
version = "0.1.0"
description = "Open-source local inference orchestration — up to 10 nodes, broadcast dispatch"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-cors>=0.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Local inference backends — install at least one
mlx = ["mlx-lm>=0.16"]
llamacpp = ["llama-cpp-python>=0.2"]
onnx = ["onnxruntime>=1.18"]
# All backends
all = ["mlx-lm>=0.16", "llama-cpp-python>=0.2", "onnxruntime>=1.18"]

[project.scripts]
vimin-core = "vimin_core.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
